name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: freedom
          POSTGRES_PASSWORD: freedom
          POSTGRES_DB: freedom_gps
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U freedom -d freedom_gps"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (compile check)
        run: python -m compileall -q app tests alembic

      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://freedom:freedom@localhost:5432/freedom_gps
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET_KEY: test-secret-key
        run: python -m pytest -q
